<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title> </title>
</head>

<body>
  <div class="modal show" id="modal">
    <div class="modal-content">
      <div class="modal-header">
        <h2>Adicionar transição</h2>
        <button id="btn-close-modal">x</button>
      </div>
      <form class="form">
        <input type="text" placeholder="R$">
        <input type="text" placeholder="Descrição">
        <select>
        <option value="">Selecione o tipo</option>
        <option value="recebimento">Recebimento</option>
        <option value="gasto">Gasto</option>
      </select>
        <button class="btn-salve">Salvar</button>
      </form>
    </div>
  </div>

  <section id="tela">
    <div class="tela">
      <div class="tela-header">

        <div class="header-logo">
          <img  src="https://img.icons8.com/ios/ffffff/50/user-male-circle--v1.png" alt="avatar de usuario"/>
          <span>
            Carlos 
          </span>
        </div>

        <img src="https://img.icons8.com/sf-regular/ffffff/48/bell.png" alt="bell" class="bell"/>

      </div>

      <div class="painel">
        <div class="box-saldo">
          <span class="title-saldo"> saldo</span>
          <span class="saldo">R$ 6000,00</span>
        </div>
      </div>

      <div class="box-mini">
        <div class="box-receita">
          <p>Receitas</p>
          <span class="receitas">R$ 8000,00</span>
        </div>
        <div class="box-gastos">
          <p>Gastos</p>
          <span class="gastos">R$ 8000,00</span>
        </div>
      </div>

      <div class="content">
        <div class="history">

          <h4>Histórico</h4>
          <ul class="rows">
            <li class="row-transation">
              <span></span>
              <p class="description positive">Lucros e ganhos</p>
              <p class="price positive">R$ 2000,00</p>
            </li>

            <li class="row-transation">
              <span></span>
              <p class="description negative">Compras</p>
              <p class="price negative">R$ 100,00</p>
            </li>

            <li class="row-transation">
              <span></span>
              <p class="description negative">Lanches</p>
              <p class="price negative">R$ 20,00</p>
            </li>

            <li class="row-transation">
              <span></span>
              <p class="description negative">Compras</p>
              <p class="price negative">R$ 100,00</p>
            </li>
            <li class="row-transation">
              <span></span>
              <p class="description positive">Salário</p>
              <p class="price positive">R$ 5000,00</p>
            </li>

          </ul>

          <button class="btn-add" id="btn-add">
            Adicionar transação
          </button>
        </div>
      </div>

      <div class="row-controlls">
        <button>
            <img  src="https://img.icons8.com/pulsar-color/48/home-page.png" alt="home-page"/>
        </button>


        <button id="btn-add-icone">
            <img src="https://img.icons8.com/3d-fluency/94/add.png" alt="add"/>
        </button>


        <button>
            <img  src="https://img.icons8.com/external-gradients-pause-08/64/external-charts-business-gradients-pause-08-2.png" alt="external-charts-business-gradients-pause-08-2"/>
          </button>
      </div>
    </div>
  </section>



</body>

</html>
